<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hamza-UM5</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="منصة تعليمية لمادة المدخل لدراسة الشريعة الإسلامية: المقرر، المصادر، الأدوار، المذاهب، الاختبارات والمكتبة.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: sticky header → deep-green hero band with geometric star field → alternating paper/surface sections → footer. Control panel = drawer from the left. */
:root{
  --paper:#F5F7F4; --surface:#FFFFFF; --ink:#14261F; --muted:#56675F; --line:#D9E2DC;
  --green:#0F5442; --green-ink:#0F5442; --tint:#E7F0EB;
  --gold:#A87B2C; --gold-soft:#F3EAD4;
  --band:#0C3A2F; --band-2:#0F4A3B; --on-band:#F4F1E6; --on-band-muted:#BFD3C9;
  --ok:#1F7A4D; --bad:#B3402E;
  --f-display:"Reem Kufi","Tajawal",system-ui,sans-serif;
  --f-body:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-quote:"Amiri","Traditional Arabic","Times New Roman",serif;
  --fs:1;
  --r:14px; --shadow:0 1px 2px rgba(12,40,30,.06),0 8px 24px -12px rgba(12,40,30,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0B1613; --surface:#11201B; --ink:#E6EEE9; --muted:#9BB0A6; --line:#22372F;
  --green:#4DB590; --green-ink:#7FD1B2; --tint:#163029;
  --gold:#D8B063; --gold-soft:#2B2617;
  --band:#08231C; --band-2:#0C2F26; --on-band:#F1EEE3; --on-band-muted:#A8C2B6;
  --ok:#5CC28C; --bad:#E57A64; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0B1613; --surface:#11201B; --ink:#E6EEE9; --muted:#9BB0A6; --line:#22372F;
  --green:#4DB590; --green-ink:#7FD1B2; --tint:#163029;
  --gold:#D8B063; --gold-soft:#2B2617;
  --band:#08231C; --band-2:#0C2F26; --on-band:#F1EEE3; --on-band-muted:#A8C2B6;
  --ok:#5CC28C; --bad:#E57A64; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:calc(17px * var(--fs));line-height:1.85;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--band)}
a{color:var(--green-ink)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.35;text-wrap:balance;margin:0;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--band) 94%,transparent);backdrop-filter:blur(8px);color:var(--on-band);border-bottom:1px solid rgba(216,176,99,.25)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;flex-shrink:0}
.brand svg{width:34px;height:34px;color:var(--gold)}
.brand b{font-family:var(--f-display);font-size:1.25rem;font-weight:700;letter-spacing:.01em}
.brand small{display:block;font-size:.72rem;color:var(--on-band-muted);line-height:1.2}
.nav{display:flex;gap:2px;margin-inline-start:auto;flex-wrap:wrap}
.nav a{color:var(--on-band-muted);text-decoration:none;padding:6px 10px;border-radius:8px;font-size:.92rem;font-weight:500;white-space:nowrap}
.nav a:hover,.nav a.on{color:var(--on-band);background:rgba(255,255,255,.08)}
.tools{display:flex;gap:6px;align-items:center}
.ibtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:transparent;color:var(--on-band);cursor:pointer}
.ibtn:hover{background:rgba(255,255,255,.08)}
.ibtn svg{width:20px;height:20px}
.cp-btn{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;height:40px;padding-inline:14px;border-radius:10px;border:1px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer;font-weight:700;font-size:.9rem}
.cp-btn:hover{background:var(--gold);color:var(--band)}
.cp-btn svg{width:18px;height:18px}
.burger{display:none}
@media (max-width:1240px){
  .nav{position:fixed;inset:calc(64px + env(safe-area-inset-top,0px)) 0 auto 0;flex-direction:column;background:var(--band);padding:10px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid rgba(216,176,99,.3);display:none;max-height:70vh;overflow:auto}
  .nav.open{display:flex}
  .nav a{padding:10px 12px;font-size:1rem}
  .burger{display:inline-grid}
  .tools{margin-inline-start:auto}
  .cp-btn span{display:none}
  .cp-btn{padding-inline:10px}
}

/* Hero */
.hero{background:var(--band);color:var(--on-band);position:relative;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.13;background-image:var(--star-tile);background-size:84px 84px}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.hero .wrap.g{display:grid;grid-template-columns:1.25fr .9fr;gap:48px;align-items:center;padding-block:64px 72px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:.82rem;font-weight:700;letter-spacing:.04em;color:var(--gold)}
.eyebrow::before{content:"";width:28px;height:1px;background:currentColor}
.hero h1{font-size:clamp(2rem,4.6vw,3.5rem);font-weight:700;margin-block:14px 18px;color:var(--on-band)}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero .lead{font-size:1.12em;color:var(--on-band-muted);max-width:58ch}
.ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:12px;font-weight:700;text-decoration:none;border:1px solid transparent;cursor:pointer;font-size:.98rem}
.btn-gold{background:var(--gold);color:#1a1405}
.btn-gold:hover{filter:brightness(1.06)}
.btn-ghost{border-color:rgba(255,255,255,.28);color:var(--on-band);background:transparent}
.btn-ghost:hover{background:rgba(255,255,255,.07)}
.verse{position:relative;background:var(--band-2);border:1px solid rgba(216,176,99,.35);border-radius:20px;padding:34px 28px 26px;text-align:center}
.verse .orn{position:absolute;inset-block-start:-18px;inset-inline:0;margin:auto;width:36px;height:36px;color:var(--gold);background:var(--band);border-radius:50%;padding:4px}
.verse q{display:block;font-family:var(--f-quote);font-size:clamp(1.45rem,2.6vw,1.9rem);line-height:2;color:var(--on-band);quotes:none}
.verse cite{display:block;margin-top:10px;font-style:normal;color:var(--gold);font-size:.9rem}
.verse p{margin-top:16px;padding-top:16px;border-top:1px dashed rgba(216,176,99,.35);color:var(--on-band-muted);font-size:.95rem}
.glance{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(255,255,255,.1)}
.glance div{padding:18px 12px;text-align:center;border-inline-start:1px solid rgba(255,255,255,.1)}
.glance div:first-child{border-inline-start:0}
.glance b{display:block;font-family:var(--f-display);font-size:2rem;color:var(--gold);line-height:1.2}
.glance span{font-size:.88rem;color:var(--on-band-muted)}
@media (max-width:860px){.hero .wrap.g{grid-template-columns:1fr;gap:40px;padding-block:44px 52px}.glance{grid-template-columns:repeat(2,1fr)}.glance div:nth-child(3){border-inline-start:0}.glance div:nth-child(n+3){border-top:1px solid rgba(255,255,255,.1)}}

/* Sections */
section.sec{padding-block:76px}
section.sec.alt{background:var(--surface);border-block:1px solid var(--line)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:36px}
.sec-head .k{font-size:.8rem;font-weight:800;letter-spacing:.06em;color:var(--gold)}
.sec-head h2{font-size:clamp(1.6rem,3vw,2.3rem);margin-top:6px}
.sec-head p{color:var(--muted);max-width:62ch;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--tint);color:var(--green-ink)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}

/* Reasons */
.reasons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.reason{padding:26px 24px;border-inline-start:1px solid var(--line);border-top:1px solid var(--line);margin:-1px 0 0 -1px}
.reason .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--tint);color:var(--green-ink);margin-bottom:14px}
.reason .ic svg{width:22px;height:22px}
@media (max-width:1000px){.reasons{grid-template-columns:repeat(6,minmax(0,1fr))}.reason{grid-column:span 2}.reason:nth-child(n+4){grid-column:span 3}}
@media (max-width:620px){.reasons{grid-template-columns:1fr}.reason,.reason:nth-child(n+4){grid-column:auto}}
.reason h3{font-size:1.1rem;margin-bottom:6px}
.reason p{color:var(--muted);font-size:.96em}

/* Syllabus */
.syl{display:grid;grid-template-columns:280px 1fr;gap:28px;align-items:start}
.syl-side{position:sticky;top:96px;display:grid;gap:14px}
.progress{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.progress .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-block:10px 6px}
.progress .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:inherit;transition:width .4s}
.progress small{color:var(--muted)}
.ch-tabs{display:grid;gap:6px}
.ch-tab{display:flex;gap:12px;align-items:center;text-align:start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);cursor:pointer}
.ch-tab .n{flex-shrink:0;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;background:var(--tint);color:var(--green-ink)}
.ch-tab b{display:block;font-size:.95rem;line-height:1.4}
.ch-tab small{color:var(--muted);font-size:.8rem}
.ch-tab[aria-selected="true"]{border-color:var(--green);background:var(--surface);box-shadow:var(--shadow)}
.ch-tab[aria-selected="true"] .n{background:var(--green);color:var(--surface)}
.ch-body{min-width:0}
.ch-intro{padding:26px 28px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line);margin-bottom:16px}
.ch-intro h3{font-size:1.45rem;margin-block:6px 8px}
.ch-intro p{color:var(--muted)}
.lesson{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:10px;overflow:hidden}
.lesson summary{list-style:none;display:flex;gap:12px;align-items:center;padding:14px 18px;cursor:pointer;font-weight:700}
.lesson summary::-webkit-details-marker{display:none}
.lesson summary .t{flex:1;min-width:0}
.lesson summary .caret{width:18px;height:18px;flex-shrink:0;transition:transform .2s;color:var(--muted)}
.lesson[open] summary .caret{transform:rotate(-90deg)}
.lesson .lb{padding:0 18px 18px 18px;color:var(--ink);border-top:1px dashed var(--line);padding-top:14px}
.lesson .lb p+p{margin-top:8px}
.done-box{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:500;color:var(--muted);cursor:pointer;flex-shrink:0}
.done-box input{accent-color:var(--green);width:17px;height:17px}
.lesson.is-done summary .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--gold)}
@media (max-width:900px){.syl{grid-template-columns:1fr}.syl-side{position:static}.ch-tabs{grid-template-columns:repeat(2,1fr)}}
@media (max-width:460px){.ch-tabs{grid-template-columns:1fr}}

/* Traits */
.traits{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.trait{padding:24px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);position:relative}
.trait .idx{font-family:var(--f-display);font-size:.85rem;color:var(--gold);font-weight:700}
.trait h3{font-size:1.15rem;margin-block:4px 8px}
.trait p{color:var(--muted);font-size:.95em}
.trait .ev{margin-top:12px;font-family:var(--f-quote);font-size:1.05rem;color:var(--green-ink);line-height:1.8}

/* Maqasid */
.maq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px;align-items:center}
.tiers{display:grid;gap:10px;justify-items:center}
.tier{width:100%;border:0;cursor:pointer;padding:18px 20px;border-radius:12px;color:var(--on-band);text-align:center;font-family:var(--f-display);font-size:1.15rem;font-weight:600;transition:transform .2s, box-shadow .2s}
.tier small{display:block;font-family:var(--f-body);font-size:.82rem;font-weight:500;opacity:.85}
.tier:nth-child(1){width:58%;background:color-mix(in srgb,var(--gold) 70%,var(--band))}
.tier:nth-child(2){width:79%;background:color-mix(in srgb,var(--green) 70%,var(--band))}
.tier:nth-child(3){width:100%;background:var(--band)}
.tier[aria-pressed="true"]{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--gold);transform:scale(1.02)}
.maq-detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;min-height:280px;min-width:0}
.maq-detail h3{font-size:1.4rem;margin-block:6px 8px}
.maq-detail>p{color:var(--muted)}
.kul{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
.kul div{padding:12px 14px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}
.kul b{display:block;font-family:var(--f-display);color:var(--green-ink)}
.kul span{font-size:.86rem;color:var(--muted);line-height:1.6;display:block}
@media (max-width:860px){.maq{grid-template-columns:1fr}}

/* Sources */
.src-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:28px;align-items:start}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:700;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--green-ink);box-shadow:var(--shadow)}
.src-list{display:grid;gap:8px}
.src-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:start;width:100%}
.src-item .n{width:30px;height:30px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;font-size:.85rem;font-weight:800;background:var(--tint);color:var(--green-ink)}
.src-item b{flex:1;font-size:1rem}
.src-item[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.src-item[aria-pressed="true"] .n{background:var(--gold);color:#1a1405}
.src-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:30px;box-shadow:var(--shadow);min-width:0}
.src-card h3{font-size:1.7rem;margin-block:8px 12px}
.src-card dl{display:grid;gap:16px;margin:18px 0 0}
.src-card dt{font-weight:800;font-size:.85rem;color:var(--gold);letter-spacing:.03em}
.src-card dd{margin:4px 0 0}
.src-card ul{margin:6px 0 0;padding-inline-start:20px}
.order{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:22px;padding:16px;border-radius:12px;background:var(--paper);border:1px dashed var(--line)}
.order span{padding:6px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.9rem}
.order i{color:var(--gold);font-style:normal}
.order small{width:100%;color:var(--muted);font-size:.84rem}
@media (max-width:860px){.src-grid{grid-template-columns:1fr}}

/* Timeline */
.tl{position:relative;display:grid;gap:18px}
.tl::before{content:"";position:absolute;inset-block:8px;inset-inline-start:21px;width:2px;background:linear-gradient(var(--green),var(--gold))}
.era{display:grid;grid-template-columns:44px 1fr;gap:18px;align-items:start}
.era .dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--green);font-family:var(--f-display);font-weight:700;color:var(--green-ink);position:relative;z-index:1}
.era-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;min-width:0}
.era-card header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.era-card h3{font-size:1.2rem}
.era-card p{color:var(--muted);margin-top:8px}
.era-card ul{margin:10px 0 0;padding-inline-start:20px}
.era-card li{margin-top:4px}
.era-card li::marker{color:var(--gold)}
.century{margin-bottom:28px;overflow-x:auto}
.century-bar{display:flex;min-width:640px;height:38px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.century-bar div{display:grid;place-items:center;font-size:.78rem;font-weight:700;color:var(--on-band);white-space:nowrap;overflow:hidden;padding-inline:4px}
.century-axis{display:flex;justify-content:space-between;min-width:640px;font-size:.74rem;color:var(--muted);margin-top:6px}

/* Madhahib */
.mad{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.imam{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.imam .cap{background:var(--band);color:var(--on-band);padding:20px 22px;position:relative;overflow:hidden}
.imam .cap::after{content:"";position:absolute;inset:0;opacity:.12;background-image:var(--star-tile);background-size:60px 60px}
.imam .cap h3{font-size:1.4rem;color:var(--gold)}
.imam .cap span{font-size:.9rem;color:var(--on-band-muted)}
.imam .bd{padding:18px 22px;display:grid;gap:10px;flex:1}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:700}
.imam p{font-size:.93rem;color:var(--muted)}
.matrix-wrap{margin-top:28px;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.matrix{border-collapse:collapse;width:100%;min-width:720px;font-size:.92rem}
.matrix th,.matrix td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:center}
.matrix th:first-child,.matrix td:first-child{text-align:start;font-weight:700;position:sticky;inset-inline-start:0;background:var(--surface)}
.matrix thead th{font-family:var(--f-display);font-weight:600;color:var(--green-ink);background:var(--paper)}
.matrix thead th:first-child{background:var(--paper)}
.yes{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--tint);color:var(--green-ink);font-weight:800}
.no{color:var(--line)}
.note{font-size:.84rem;color:var(--muted);margin-top:10px}

/* Glossary */
.gl-tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.search svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.search input{border:0;background:transparent;padding:12px 0;width:100%;outline:none}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.term{padding:18px 20px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.term b{font-family:var(--f-display);font-size:1.12rem;color:var(--green-ink);font-weight:600}
.term p{color:var(--muted);font-size:.94em;margin-top:4px}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

/* Quiz */
.quiz{max-width:760px;margin-inline:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:var(--shadow)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.qbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:22px}
.qbar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.quiz h3{font-size:1.3rem;margin-bottom:18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:start;width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:1rem}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt .l{width:28px;height:28px;flex-shrink:0;display:grid;place-items:center;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-weight:800;font-size:.85rem}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt:disabled{cursor:default}
.explain{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--gold-soft);font-size:.95rem}
.qfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.btn-main{background:var(--green);color:var(--surface)}
.btn-line{border-color:var(--line);background:transparent;color:var(--ink)}
.score{text-align:center;padding-block:10px}
.score b{display:block;font-family:var(--f-display);font-size:3.4rem;color:var(--gold);line-height:1.3}

/* Library */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.book{display:grid;grid-template-columns:74px 1fr;gap:16px;padding:20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);align-items:start}
.spine{height:100px;border-radius:4px 10px 10px 4px;background:var(--band);position:relative;overflow:hidden;box-shadow:inset 6px 0 0 rgba(0,0,0,.22)}
.spine::after{content:"";position:absolute;inset:0;opacity:.22;background-image:var(--star-tile);background-size:34px 34px}
.spine span{position:absolute;inset-inline:6px;bottom:10px;height:2px;background:var(--gold)}
.book:nth-child(3n+2) .spine{background:color-mix(in srgb,var(--gold) 55%,var(--band))}
.book:nth-child(3n) .spine{background:color-mix(in srgb,var(--green) 60%,var(--band))}
.book h3{font-size:1.06rem;line-height:1.5}
.book .by{color:var(--green-ink);font-weight:700;font-size:.9rem}
.book p{color:var(--muted);font-size:.9rem;margin-top:6px}
.book .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.book a.open{font-size:.85rem;font-weight:700}
.lib-filter{margin-bottom:18px}
.authors{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:40px}
.author{display:flex;gap:14px;padding:20px;border-radius:var(--r);border:1px solid var(--line);background:var(--paper)}
.author .av{width:52px;height:52px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:var(--band);color:var(--gold);font-family:var(--f-display);font-size:1.3rem;font-weight:700}
.author h4{font-size:1.06rem}
.author small{color:var(--gold);font-weight:700}
.author p{color:var(--muted);font-size:.9rem;margin-top:4px}
.sub-h{font-size:1.3rem;margin-top:44px}

/* Footer */
footer{background:var(--band);color:var(--on-band-muted);padding-block:40px;font-size:.92rem}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
footer b{color:var(--on-band);font-family:var(--f-display)}

/* Control panel */
.ov{position:fixed;inset:0;background:rgba(5,20,15,.5);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.show{opacity:1;pointer-events:auto}
.cp{position:fixed;inset-block:0;left:0;width:min(560px,100%);z-index:90;background:var(--surface);color:var(--ink);box-shadow:0 0 60px rgba(0,0,0,.35);transform:translateX(-102%);transition:transform .28s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
.cp.show{transform:none}
.cp-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--band);color:var(--on-band)}
.cp-h h2{font-size:1.2rem;flex:1}
.cp-h .ibtn{border-color:rgba(255,255,255,.2)}
.cp-tabs{display:flex;gap:4px;padding:10px 14px;border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0}
.cp-tabs button{border:0;background:transparent;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:700;font-size:.88rem;color:var(--muted);white-space:nowrap}
.cp-tabs button[aria-selected="true"]{background:var(--tint);color:var(--green-ink)}
.cp-b{flex:1;overflow-y:auto;padding:20px}
.cp-f{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:var(--paper);flex-wrap:wrap}
.fld{display:grid;gap:6px;margin-bottom:14px}
.fld label{font-size:.85rem;font-weight:700;color:var(--muted)}
.fld input[type=text],.fld input[type=password],.fld input[type=number],.fld input[type=url],.fld select,.fld textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper)}
.fld textarea{min-height:90px;resize:vertical;line-height:1.7}
.fld .hint{font-size:.78rem;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.color-row{display:flex;align-items:center;gap:10px}
.color-row input[type=color]{width:46px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:2px;cursor:pointer}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--paper)}
.sw .mv{display:flex;gap:4px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:.82rem;font-weight:700}
.mini.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.mini.arm{background:var(--bad);color:#fff}
.item{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--paper)}
.item>summary{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;font-weight:700;list-style:none}
.item>summary::-webkit-details-marker{display:none}
.item>summary .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .ib{padding:4px 14px 14px}
.lock{max-width:340px;margin:40px auto;text-align:center}
.lock svg{width:46px;height:46px;color:var(--gold)}
.lock h3{margin-block:10px 6px}
.lock p{color:var(--muted);font-size:.9rem;margin-bottom:16px}
.err{color:var(--bad);font-size:.86rem;min-height:1.4em}
.helpbox{padding:14px 16px;border-radius:12px;background:var(--gold-soft);font-size:.88rem;margin-bottom:16px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:10px;font-weight:700;z-index:100;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>

  if(custom){
    const B=t.band, G=t.gold, N=t.green;
    const dark = `--band:color-mix(in srgb,${B} 62%,black);--band-2:color-mix(in srgb,${B} 72%,black);--gold:color-mix(in srgb,${G} 72%,white);--green:color-mix(in srgb,${N} 55%,white);--green-ink:color-mix(in srgb,${N} 40%,white);--tint:color-mix(in srgb,${N} 28%,#0B1613);--gold-soft:color-mix(in srgb,${G} 18%,#0B1613);`;
    st.textContent = `:root{--band:${B};--band-2:color-mix(in srgb,${B} 86%,white);--gold:${G};--green:${N};--green-ink:${N};--tint:color-mix(in srgb,${N} 10%,white);--gold-soft:color-mix(in srgb,${G} 16%,white)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){${dark}}}
:root[data-theme="dark"]{${dark}}`;
  } else st.textContent = "";
  // light/dark
  const pref = store.get(K.theme) || t.defaultTheme || "system";
  if(pref === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", pref);
  syncThemeBtn();
}
function isDark(){
  const a = document.documentElement.getAttribute("data-theme");
  if(a) return a === "dark";
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
}
function syncThemeBtn(){ $("#theme-btn").innerHTML = icon(isDark() ? "i-sun" : "i-moon"); }
$("#theme-btn").addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next); store.set(K.theme, next); syncThemeBtn();
});

/* ---------- interactions (delegated) ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-ch],[data-maq],[data-grp],[data-src],[data-opt],#qz-next,#qz-re,[data-kind],#burger,.nav a");
  if(!t) return;
  if(t.dataset.ch !== undefined){ curCh = +t.dataset.ch; $$(".ch-tab").forEach(b=>b.setAttribute("aria-selected", String(+b.dataset.ch===curCh))); renderChapter(); }
  else if(t.dataset.maq !== undefined){ curMaq = +t.dataset.maq; renderMaq(); }
  else if(t.dataset.grp !== undefined){ srcGroup = t.dataset.grp; renderSrc(); }
  else if(t.dataset.src !== undefined){ curSrc = +t.dataset.src; renderSrc(); }
  else if(t.dataset.opt !== undefined){ if(qz.picked!==null) return; qz.picked = +t.dataset.opt; if(qz.picked === (+DATA.quiz[qz.i].answer||1)-1) qz.score++; renderQuiz(); }
  else if(t.id === "qz-next"){ qz.i++; qz.picked = null; renderQuiz(); }
  else if(t.id === "qz-re"){ qz = {i:0,score:0,picked:null}; renderQuiz(); }
  else if(t.dataset.kind !== undefined){ libKind = t.dataset.kind; renderLib(); }
  else if(t.id === "burger"){ const n = $("#nav"); n.classList.toggle("open"); t.setAttribute("aria-expanded", String(n.classList.contains("open"))); }

});

let io;
function observeNav(){
  if(io) io.disconnect(); if(!("IntersectionObserver" in window)) return;
  io = new IntersectionObserver(es => es.forEach(en => { if(en.isIntersecting){ $$(".nav a").forEach(a=>a.classList.toggle("on", a.dataset.nav===en.target.id)); } }), {rootMargin:"-45% 0px -50% 0px"});
  $$("main section[id]").forEach(s=>io.observe(s));
}

function fieldHTML(path, type, label, val, opts){
  const id = "f-" + path.replace(/[^a-zA-Z0-9]/g,"-");
  let ctl;
  if(type === "textarea") ctl = `<textarea id="${id}" data-path="${path}" data-type="text">${esc(val)}</textarea>`;
  else if(type === "lines") ctl = `<textarea id="${id}" data-path="${path}" data-type="lines" style="min-height:120px">${esc((val||[]).join("\n"))}</textarea>`;
  else if(type === "pairs") ctl = `<textarea id="${id}" data-path="${path}" data-type="pairs" style="min-height:200px">${esc((val||[]).map(p=>p.t+" | "+p.b).join("\n"))}</textarea>`;
  else if(type === "select") ctl = `<select id="${id}" data-path="${path}" data-type="text">${opts.map(o=>`<option ${o===val?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else ctl = `<input id="${id}" type="${type==="number"?"number":type==="url"?"url":type==="password"?"password":"text"}" data-path="${path}" data-type="text" value="${esc(val)}" ${type==="url"?'dir="ltr"':""}>`;
  return `<div class="fld"><label for="${id}">${esc(label)}</label>${ctl}</div>`;
}
function setPath(path, v){ const p = path.split("."); let o = DATA; for(let i=0;i<p.length-1;i++) o = o[p[i]]; o[p[p.length-1]] = v; }
function getPath(path){ return path.split(".").reduce((o,k)=>o==null?o:o[k], DATA); }

function drawCP(){
  const b = $("#cp-b");
  if(!unlocked()){
    $("#cp-tabs").hidden = true; $("#cp-f").hidden = true; $("#cp-lockbtn").hidden = true;
    b.innerHTML = `<form class="lock" id="lock-form"><svg><use href="#i-lock"/></svg><h3>دخول المشرف</h3><p>أدخل الرمز السري لتعديل محتوى الموقع ومظهره.</p>
      <div class="fld"><input id="pin-in" type="password" inputmode="numeric" autocomplete="current-password" placeholder="الرمز السري" style="text-align:center"></div>
      <div class="err" id="pin-err"></div><button class="btn btn-main" type="submit" style="width:100%;justify-content:center">دخول</button>
      <p style="margin-top:14px;font-size:.8rem">الرمز الافتراضي <b class="num">1234</b>، غيّره من تبويب «الأمان».</p></form>`;
    $("#lock-form").addEventListener("submit", ev => { ev.preventDefault();
      if($("#pin-in").value === getPin()){ store.set(K.unlocked,"1",true); drawCP(); toast("مرحبا بك في لوحة التحكم"); }
      else { $("#pin-err").textContent = "الرمز غير صحيح. حاول مرة أخرى."; $("#pin-in").select(); } });
    setTimeout(()=>$("#pin-in")?.focus(), 50);
    return;
  }
  $("#cp-tabs").hidden = false; $("#cp-lockbtn").hidden = false;
  $("#cp-tabs").innerHTML = TABS.map(([k,l])=>`<button type="button" role="tab" data-cptab="${k}" aria-selected="${k===cpTab}">${l}</button>`).join("");
  $("#cp-f").hidden = ["backup","security"].includes(cpTab);

  b.scrollTop = 0;
}

/* panel events */
$("#cp").addEventListener("click", e => {
  const t = e.target.closest("button,[data-cptab]"); if(!t) return;
  if(t.dataset.cptab){ cpTab = t.dataset.cptab; drawCP(); return; }
  if(t.dataset.secmv){ e.preventDefault(); const [i,d] = t.dataset.secmv.split(":").map(Number); const j = i+d; if(j<0||j>=DATA.sections.length) return; [DATA.sections[i],DATA.sections[j]]=[DATA.sections[j],DATA.sections[i]]; dirty=true; drawCP(); return; }
  if(t.dataset.mv){ e.preventDefault(); const [i,d] = t.dataset.mv.split(":").map(Number); const a = DATA[cpColl], j = i+d; if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; openItem=j; dirty=true; drawCP(); return; }
  if(t.dataset.del){ e.preventDefault(); if(!t.classList.contains("arm")){ t.classList.add("arm"); t.textContent="تأكيد الحذف"; setTimeout(()=>{ if(t.isConnected){ t.classList.remove("arm"); t.textContent="حذف"; } }, 3000); return; }
    DATA[cpColl].splice(+t.dataset.del,1); openItem=-1; dirty=true; drawCP(); toast("حُذف العنصر — اضغط حفظ لاعتماده"); return; }
  if(t.id === "add-item"){ const o = {}; SCHEMA[cpColl].fields.forEach(([k,ty,l,op])=>o[k] = (ty==="lines"||ty==="pairs") ? [] : ty==="select" ? op[0] : ty==="number" ? "1" : ""); DATA[cpColl].push(o); openItem = DATA[cpColl].length-1; dirty=true; drawCP(); setTimeout(()=>{ const el = $(`[data-item="${openItem}"]`); el && el.scrollIntoView({block:"center"}); }, 30); return; }
  if(t.id === "reset-colors"){ ["band","gold","green"].forEach(k=>DATA.theme[k]=DEF_T[k]); dirty=true; drawCP(); applyTheme(); return; }
  if(t.id === "copy-exp"){ const ta = $("#exp"); const txt = ta.value;
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast("تم نسخ البيانات")).catch(()=>{ ta.focus(); ta.select(); toast("حدّد النص وانسخه يدويا"); }); return; }
  if(t.id === "dl-exp"){ try{ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(DATA,null,2)],{type:"application/json"})); a.download = "sharia-site-data.json"; document.body.appendChild(a); a.click(); a.remove(); toast("إن لم يبدأ التنزيل فاستخدم زر النسخ"); }catch(err){ toast("التنزيل غير متاح هنا، استخدم زر النسخ"); } return; }
  if(t.id === "do-imp"){ try{ const o = JSON.parse($("#imp").value); if(!o || !o.site || !Array.isArray(o.chapters)) throw new Error("x"); DATA = o; const fixed = loadDataFrom(o); DATA = fixed; saveAll(); toast("تم استيراد المحتوى"); cpTab="general"; drawCP(); }catch(err){ $("#imp-err").textContent = "الملف غير صالح: تأكد أنه ملف JSON مصدَّر من هذه اللوحة."; } return; }
  if(t.id === "reset-all"){ if(!t.classList.contains("arm")){ t.classList.add("arm"); t.textContent="اضغط مجددا للتأكيد"; setTimeout(()=>{ if(t.isConnected){ t.classList.remove("arm"); t.textContent="استعادة المحتوى الأصلي"; } },3000); return; }
    store.del(K.data); DATA = loadData(); dirty=false; renderSite(); drawCP(); toast("تمت استعادة المحتوى الأصلي"); return; }
  if(t.id === "reset-prog"){ progress.clear(); store.del(K.prog); renderSite(); toast("تم مسح التقدم"); return; }
});
function loadDataFrom(o){ const def = clone(window.DEFAULT_DATA); for(const k in def){ if(!(k in o)) o[k] = def[k]; } for(const k in def.theme){ if(!(k in o.theme)) o.theme[k]=def.theme[k]; } for(const k in def.site){ if(!(k in o.site)) o.site[k]=def.site[k]; } return o; }

$("#cp").addEventListener("input", e => {
  const el = e.target;
  if(el.id === "coll"){ return; }
  if(el.id === "imp" || el.id === "exp" || el.dataset.path === undefined || el.dataset.path.startsWith("_")) return;
  let v = el.value;
  if(el.dataset.type === "lines") v = v.split("\n").map(s=>s.trim()).filter(Boolean);
  if(el.dataset.type === "pairs") v = v.split("\n").map(s=>s.trim()).filter(Boolean).map(s=>{ const [a,b]=split(s); return {t:a,b:b}; });
  if(el.dataset.path === cpColl && SCHEMA[cpColl].special) { DATA[cpColl] = v; dirty = true; return; }
  setPath(el.dataset.path, v); dirty = true;
  if(el.type === "color"){ el.nextElementSibling.textContent = el.value; applyTheme(); }
  if(el.id === "f-scale"){ $("#scale-v").textContent = Math.round(v*100)+"%"; applyTheme(); }
  const sum = el.closest(".item"); if(sum){ const sc = SCHEMA[cpColl]; if(el.dataset.path.endsWith("."+sc.title)) sum.querySelector(".t").textContent = v || "(بدون عنوان)"; }
});
$("#cp").addEventListener("change", e => {
  const el = e.target;
  if(el.id === "coll"){ cpColl = el.value; openItem = -1; drawCP(); return; }
  if(el.dataset.secvis !== undefined){ DATA.sections[+el.dataset.secvis].visible = el.checked; dirty = true; return; }
  if(el.id === "f-font" || el.id === "f-dt"){ applyTheme(); }
  if(el.id === "imp-file" && el.files[0]){ const r = new FileReader(); r.onload = () => { $("#imp").value = r.result; }; r.readAsText(el.files[0]); }
});
$("#cp").addEventListener("toggle", e => { const d = e.target; if(d.matches && d.matches(".item") && d.open) openItem = +d.dataset.item; }, true);
$("#cp").addEventListener("submit", e => {
  if(e.target.id !== "pin-form") return; e.preventDefault();
  const cur = $("#f--cur").value, n1 = $("#f--new").value, n2 = $("#f--new2").value, err = $("#pinf-err");
  if(cur !== getPin()) return err.textContent = "الرمز الحالي غير صحيح.";
  if(n1.length < 4) return err.textContent = "اختر رمزا من 4 خانات على الأقل.";
  if(n1 !== n2) return err.textContent = "الرمزان الجديدان غير متطابقين.";
  store.set(K.pin, n1); err.textContent = ""; e.target.reset(); toast("تم تغيير الرمز السري");
});
function saveAll(){ const ok = store.set(K.data, JSON.stringify(DATA)); dirty = false; renderSite(); return ok; }
$("#cp-save").addEventListener("click", () => { const ok = saveAll(); toast(ok ? "تم الحفظ والنشر على هذا المتصفح" : "طُبّقت التغييرات، لكن المتصفح يمنع الحفظ الدائم"); });
$("#cp-revert").addEventListener("click", () => { DATA = loadData(); dirty = false; renderSite(); drawCP(); toast("أُلغيت التغييرات غير المحفوظة"); });

/* boot */
renderSite();
if(window.matchMedia){ try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncThemeBtn); }catch(e){} }
})();
</script>
